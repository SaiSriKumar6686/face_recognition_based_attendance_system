{% extends "base.html" %}

{% block page_title %}Enrollment Result{% endblock %}

{% block content %}
<div class="glass-card" style="max-width: 500px; margin: 2rem auto; text-align: center; padding: 3rem 2rem;">
    {% if success %}
        <i class="ph ph-check-circle" style="font-size: 4rem; color: var(--success); margin-bottom: 1rem;"></i>
        <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Enrollment Successful</h2>
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">{{ message }}</p>
        <a href="{{ url_for('students') }}" class="btn btn-primary" style="width: 100%;">Return to Students List</a>
    {% else %}
        <i class="ph ph-x-circle" style="font-size: 4rem; color: var(--danger); margin-bottom: 1rem;"></i>
        <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Enrollment Failed</h2>
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">{{ message }}</p>
        <a href="{{ url_for('students') }}" class="btn btn-primary" style="width: 100%;">Try Again</a>
    {% endif %}
</div>
{% endblock %}
