<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Face Guard AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card glass-card">
            <div class="login-header">
                <h1 class="login-logo">Face Guard AI</h1>
                <p class="login-subtitle">Attendance System</p>
            </div>

            {% if error %}
            <div class="login-error">
                <i class="ph ph-warning-circle" style="margin-right: 0.5rem;"></i>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="form-group">
                    <label for="username">
                        <i class="ph ph-user" style="margin-right: 0.25rem;"></i> Username
                    </label>
                    <input type="text" id="username" name="username" class="form-control"
                           placeholder="admin" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">
                        <i class="ph ph-lock" style="margin-right: 0.25rem;"></i> Password
                    </label>
                    <input type="password" id="password" name="password" class="form-control"
                           placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.875rem; margin-top: 0.5rem;">
                    <i class="ph ph-sign-in" style="margin-right: 0.5rem;"></i>
                    Sign In
                </button>
            </form>

            <p class="login-hint">
                Default credentials: <code>admin</code> / <code>admin123</code>
            </p>
        </div>

        <div class="login-features">
            <div class="login-feature">
                <i class="ph ph-scan" style="font-size: 1.5rem; color: var(--accent-primary);"></i>
                <span>Face Recognition</span>
            </div>
            <div class="login-feature">
                <i class="ph ph-shield-check" style="font-size: 1.5rem; color: var(--success);"></i>
                <span>Anti-Spoofing</span>
            </div>
            <div class="login-feature">
                <i class="ph ph-chart-line-up" style="font-size: 1.5rem; color: var(--warning);"></i>
                <span>Analytics</span>
            </div>
        </div>
    </div>
</body>
</html>
